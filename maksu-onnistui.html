
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maksu hyväksytty! | Kissakoira</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .check {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            background: #e4f8e9;
            color: #25a64a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            color: #25a64a;
            margin-bottom: 12px;
        }

        p {
            line-height: 1.6;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="check">✓</div>

        <h1>Maksu hyväksytty!</h1>

        <h3>Kiitos tilauksestasi! ❤️</h3>

        <p>
            Maksusi on vastaanotettu onnistuneesti.
            Tilauksesi käsitellään mahdollisimman pian.
        </p>

        <p>
            Kiitos, että asioit Kissakoira-verkkokaupassa!
        </p>

        <a href="index.html" class="button">
            Takaisin etusivulle
        </a>

    </div>

</body>
</html>
