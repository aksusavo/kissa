<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>2048 - Kissakoira.xyz</title>

    <style>
        :root {
            --bg: #f4f1ec;
            --ink: #1d1b18;
            --muted: #6b665e;
            --btn: #2d5be3;
            --btn-ink: #fff;
            --line: #d9d3c8;
            --board: #d9d0c3;
            --empty: #eee7dd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 85px 16px 35px;
            background: var(--bg);
            color: var(--ink);
            font-family: "Trebuchet MS", system-ui, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 6px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            z-index: 1000;
        }

        .navbar a {
            padding: 10px 13px;
            border-radius: 10px;
            background: var(--btn);
            color: var(--btn-ink);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        h1 {
            margin: 5px 0 0;
            font-size: 2.5rem;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        /* KUVAPAIKKA 1:
           Korvaa tämän laatikon sisältö omalla kuvallasi.
           Ohjeet löytyvät pelin alta. */

        .image-slot {
            width: min(100%, 420px);
            min-height: 70px;
            padding: 12px;
            border: 2px dashed var(--line);
            border-radius: 12px;
            color: var(--muted);
            display: grid;
            place-items: center;
            font-size: 0.85rem;
        }

        .image-slot img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .game {
            width: min(100%, 420px);
        }

        .score-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .score-box {
            flex: 1;
            background: var(--board);
            border-radius: 10px;
            padding: 10px 5px;
        }

        .score-label {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .score-number {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 9px;
            padding: 9px;
            background: var(--board);
            border-radius: 12px;
            touch-action: none;
            user-select: none;
        }

        .tile {
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: var(--empty);
            font-size: clamp(1.2rem, 7vw, 2.3rem);
            font-weight: 800;
            overflow: hidden;
        }

        .tile[data-value="2"] {
            background: #eee4da;
            color: #665c52;
        }

        .tile[data-value="4"] {
            background: #ede0c8;
            color: #665c52;
        }

        .tile[data-value="8"] {
            background: #f2b179;
            color: white;
        }

        .tile[data-value="16"] {
            background: #f59563;
            color: white;
        }

        .tile[data-value="32"] {
            background: #f67c5f;
            color: white;
        }

        .tile[data-value="64"] {
            background: #f65e3b;
            color: white;
        }

        .tile[data-value="128"] {
            background: #edcf72;
            color: white;
            font-size: clamp(1rem, 5.5vw, 1.8rem);
        }

        .tile[data-value="256"] {
            background: #edcc61;
            color: white;
            font-size: clamp(1rem, 5.5vw, 1.8rem);
        }

        .tile[data-value="512"] {
            background: #edc850;
            color: white;
            font-size: clamp(1rem, 5.5vw, 1.8rem);
        }

        .tile[data-value="1024"],
        .tile[data-value="2048"] {
            background: #edc53f;
            color: white;
            font-size: clamp(0.85rem, 4.5vw, 1.5rem);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: var(--btn);
            color: var(--btn-ink);
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            color: var(--ink);
        }

        .instructions {
            max-width: 420px;
            line-height: 1.6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15161a;
                --ink: #eceae5;
                --muted: #aaa69e;
                --btn: #6b8cff;
                --btn-ink: #0d0f14;
                --line: #35363d;
                --board: #38352f;
                --empty: #4a463f;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html">Etusivu</a>
        <a href="koirat.html">Koirat</a>
        <a href="kissat.html">Kissat</a>
        <a href="2048.html">Peli</a>
    </nav>

    <h1>kissa..</h1>


    <main class="game">
        <div class="score-row">
            <div class="score-box">
                <span class="score-label">Pisteet</span>
                <span class="score-number" id="score">0</span>
            </div>

            <div class="score-box">
                <span class="score-label">Ennätys</span>
                <span class="score-number" id="best">0</span>
            </div>
        </div>

        <div class="board" id="board" aria-label="2048-pelilauta"></div>

        <div class="buttons">
            <button id="restart">Uusi peli</button>
        </div>

        <p id="message" aria-live="polite">Onnea peliin!</p>
    </main>

   

   

    

    <script>
        const boardElement = document.getElementById("board");
        const scoreElement = document.getElementById("score");
        const bestElement = document.getElementById("best");
        const messageElement = document.getElementById("message");

        let board = [];
        let score = 0;
        let best = 0;
        let won = false;
        let over = false;

        try {
            best = Number(localStorage.getItem("2048-best")) || 0;
        } catch (error) {
            best = 0;
        }

        function newGame() {
            board = Array(16).fill(0);
            score = 0;
            won = false;
            over = false;

            addTile();
            addTile();
            messageElement.textContent = "Onnea peliin!";
            render();
        }

        function addTile() {
            const empty = [];

            board.forEach((value, index) => {
                if (value === 0) {
                    empty.push(index);
                }
            });

            if (empty.length === 0) {
                return;
            }

            const index = empty[
                Math.floor(Math.random() * empty.length)
            ];

            board[index] = Math.random() < 0.9 ? 2 : 4;
        }


        const animals = {
            2: "🐱",
            4: "🐶",
            8: "🐰",
            16: "🦊",
            32: "🐼",
            64: "🦁",
            128: "🐯",
            256: "🐨",
            512: "🐸",
            1024: "🦄",
            2048: "🐉"
        };

        function render() {
            boardElement.innerHTML = "";

            board.forEach(value => {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.dataset.value = value;

                if (value !== 0) {
                    tile.textContent = animals[value] || "🐾";
                    tile.setAttribute(
                        "aria-label",
                        "Eläin, arvo " + value
                    );
                }

                boardElement.appendChild(tile);
            });

            scoreElement.textContent = score;
            bestElement.textContent = best;
        }


        function slideLine(line) {
            const values = line.filter(value => value !== 0);
            const result = [];
            let gained = 0;

            for (let i = 0; i < values.length; i++) {
                if (values[i] === values[i + 1]) {
                    const merged = values[i] * 2;
                    result.push(merged);
                    gained += merged;
                    i++;
                } else {
                    result.push(values[i]);
                }
            }

            while (result.length < 4) {
                result.push(0);
            }

            return { line: result, gained: gained };
        }

        function move(direction) {
            if (over) {
                return;
            }

            const oldBoard = [...board];
            let gainedTotal = 0;

            for (let i = 0; i < 4; i++) {
                let indexes = [];

                for (let j = 0; j < 4; j++) {
                    if (direction === "left") {
                        indexes.push(i * 4 + j);
                    } else if (direction === "right") {
                        indexes.push(i * 4 + (3 - j));
                    } else if (direction === "up") {
                        indexes.push(j * 4 + i);
                    } else {
                        indexes.push((3 - j) * 4 + i);
                    }
                }

                const line = indexes.map(index => board[index]);
                const result = slideLine(line);

                indexes.forEach((index, j) => {
                    board[index] = result.line[j];
                });

                gainedTotal += result.gained;
            }

            if (board.every((value, i) => value === oldBoard[i])) {
                return;
            }

            score += gainedTotal;

            if (score > best) {
                best = score;

                try {
                    localStorage.setItem("2048-best", String(best));
                } catch (error) {
                    // Peli toimii myös ilman tallennusta.
                }
            }

            addTile();

            if (!won && board.includes(2048)) {
                won = true;
                messageElement.textContent =
                    "Upea! Saavutit 2048:n! Voit jatkaa pelaamista.";
            } else if (!hasMoves()) {
                over = true;
                messageElement.textContent =
                    "Peli päättyi! Aloita uusi peli.";
            }

            render();
        }

        function hasMoves() {
            for (let i = 0; i < 16; i++) {
                if (board[i] === 0) {
                    return true;
                }

                const row = Math.floor(i / 4);
                const col = i % 4;

                if (col < 3 && board[i] === board[i + 1]) {
                    return true;
                }

                if (row < 3 && board[i] === board[i + 4]) {
                    return true;
                }
            }

            return false;
        }

        document.addEventListener("keydown", event => {
            const directions = {
                ArrowLeft: "left",
                ArrowRight: "right",
                ArrowUp: "up",
                ArrowDown: "down"
            };

            if (directions[event.key]) {
                event.preventDefault();
                move(directions[event.key]);
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        boardElement.addEventListener("touchstart", event => {
            touchStartX = event.changedTouches[0].clientX;
            touchStartY = event.changedTouches[0].clientY;
        }, { passive: true });

        boardElement.addEventListener("touchend", event => {
            const dx = event.changedTouches[0].clientX - touchStartX;
            const dy = event.changedTouches[0].clientY - touchStartY;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) {
                return;
            }

            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? "right" : "left");
            } else {
                move(dy > 0 ? "down" : "up");
            }
        }, { passive: true });

        document.getElementById("restart").addEventListener("click", newGame);

        newGame();
    </script>
</body>

</html>
