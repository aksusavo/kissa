<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Koira Kissa nettisivu</title>
    <style>
        :root {
            --bg: #f4f1ec;
            --ink: #1d1b18;
            --muted: #6b665e;
            --btn: #2d5be3;
            --btn-ink: #fff;
            --line: #d9d3c8;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #15161a;
                --ink: #eceae5;
                --muted: #9a978f;
                --btn: #6b8cff;
                --btn-ink: #0d0f14;
                --line: #2c2e35
            }
        }

        :root[data-theme="dark"] {
            --bg: #15161a;
            --ink: #eceae5;
            --muted: #9a978f;
            --btn: #6b8cff;
            --btn-ink: #0d0f14;
            --line: #2c2e35
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: "Trebuchet MS", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: cen;
            gap: 28px;
            padding: 20px;
            text-align: center
        }

        #count {
            font-size: clamp(5rem, 28vw, 10rem);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums
        }

        #press {
            width: min(78vw, 260px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 0;
            background: var(--btn);
            color: var(--btn-ink);
            font: inherit;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0, 0, 0, .25);
            transition: transform .08s, box-shadow .08s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation
        }

        #press:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, .25)
        }

        .small {
            display: flex;
            gap: 10px
        }

        .small button {
            font: inherit;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1.5px solid var(--line);
            background: transparent;
            color: var(--ink);
            cursor: pointer
        }

        button:focus-visible {
            outline: 3px solid var(--btn);
            outline-offset: 3px
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: .95rem
        }

        .google {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            background: var(--btn);
            color: var(--btn-ink);
            text-decoration: none;
            font-weight: 700
        }

        .google:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px
        }

        img.kuva {
            width: min(70vw, 220px);
            height: auto;
            border-radius: 12px;
            border: 1.5px solid var(--line)
        }

        @media (prefers-reduced-motion:reduce) {
            #press {
                transition: none
            }
        }

        .kuvat {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .kuva {
            width: min(50vw, 220px);
            height: auto;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            z-index: 1000;
        }

        .navbar a {
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--btn);
            color: var(--btn-ink);
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            opacity: 0.8;
        }

        body {
            padding-top: 85px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html">Etusivu</a>
        <a href="koirat.html">Koirat</a>
        <a href="kissat.html">Kissat</a>
    </nav>
    <h1>koirakissa.xyz</h1>
    <div id="count" aria-live="polite">0</div>
    <button id="press">Paina tästä</button>
    <div class="small">
        <button id="undo">Peru</button>
        <button id="reset">Nollaa</button>
    </div>

    <p>Luku säilyy tällä laitteella, vaikka sulkisit sivun.</p>

    <div class="kuvat">
        <img class="kuva" src="photos1/kuva.png" alt="tonni">
        <img class="kuva" src="photos1/cat.png" alt="Kissa">
    </div>




    <img class="kuva" src="photos1/koira.png" alt="Kuva koirasta">

    <script>
        (function () {
            var n = 1, el = document.getElementById('count');
            try { var s = localStorage.getItem('painallukset'); if (s !== null && !isNaN(+s)) n = +s } catch (e) { }
            function show() { el.textContent = n; try { localStorage.setItem('painallukset', String(n)) } catch (e) { } }
            document.getElementById('press').addEventListener('click', function () { n++; show() });
            document.getElementById('undo').addEventListener('click', function () { if (n > 0) { n--; show() } });
            document.getElementById('reset').addEventListener('click', function () {
                n = 0;
                show();
            });
        })();
    </script>
</body>

</html>
